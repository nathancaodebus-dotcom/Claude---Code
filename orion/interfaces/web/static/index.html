<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>O.R.I.O.N.</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%234be3ff' stroke-width='2.5' stroke-dasharray='4 3'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%234be3ff'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="scanlines" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<header class="hud-header">
  <div class="brand">
    <div class="core-mini" id="core-mini">
      <svg viewBox="0 0 100 100" class="ring ring--a"><circle cx="50" cy="50" r="46" /></svg>
      <svg viewBox="0 0 100 100" class="ring ring--b"><circle cx="50" cy="50" r="36" /></svg>
      <div class="core-dot"></div>
    </div>
    <div class="brand-text">
      <span class="brand-name" id="brand-name">O.R.I.O.N.</span>
      <span class="brand-sub" id="status-line">SYSTEM ACTIVE</span>
    </div>
  </div>
  <div class="readouts">
    <div class="readout"><span class="readout-label">CORE_STATUS</span><span class="readout-value" id="readout-core">--</span></div>
    <div class="readout"><span class="readout-label">MODEL</span><span class="readout-value" id="readout-model">--</span></div>
    <div class="readout"><span class="readout-label">TIME</span><span class="readout-value" id="readout-clock">--:--:--</span></div>
  </div>
</header>

<main class="stage">
  <section class="hero" id="hero">
    <div class="core-hero" id="core-hero">
      <div class="nebula">
        <span class="nebula-blob nebula-blob--teal"></span>
        <span class="nebula-blob nebula-blob--violet"></span>
        <span class="nebula-blob nebula-blob--blue"></span>
      </div>
      <svg viewBox="0 0 400 400" class="hero-ring hero-ring--1"><circle cx="200" cy="200" r="188" /></svg>
      <svg viewBox="0 0 400 400" class="hero-ring hero-ring--2"><circle cx="200" cy="200" r="156" /></svg>
      <svg viewBox="0 0 400 400" class="hero-ring hero-ring--3"><circle cx="200" cy="200" r="124" /></svg>
      <svg viewBox="0 0 400 400" class="hero-ticks"><circle cx="200" cy="200" r="188" /></svg>
      <canvas id="particles" width="400" height="400"></canvas>
      <div class="hero-glow"></div>
      <!-- The Orion figure: a running/lunging hunter, spear raised, drawn
           as a smoky constellation — a soft teal-to-violet glow filling the
           silhouette (figure-glow), star-points at each joint connected by
           thin lines (figure-lines/figure-joints) on top. Not a literal
           copy of the user's reference art (that image only ever existed
           as chat content, never as a file this environment could read/
           embed) — a code-built interpretation of the same idea: a
           constellation hunter, no lettering at the center. -->
      <svg viewBox="0 0 400 400" class="hero-figure" aria-label="ORION">
        <defs>
          <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--teal)" stop-opacity="0.55" />
            <stop offset="50%" stop-color="var(--cyan)" stop-opacity="0.4" />
            <stop offset="100%" stop-color="var(--violet)" stop-opacity="0.5" />
          </linearGradient>
          <filter id="figureBlur" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="9" />
          </filter>
        </defs>

        <g class="scatter-stars">
          <circle cx="110" cy="80" r="1.1" />
          <circle cx="330" cy="60" r="1.3" />
          <circle cx="345" cy="140" r="1" />
          <circle cx="90" cy="200" r="1.2" />
          <circle cx="100" cy="330" r="1" />
          <circle cx="300" cy="340" r="1.3" />
          <circle cx="335" cy="260" r="1" />
          <circle cx="75" cy="130" r="1.1" />
          <circle cx="140" cy="60" r="1" />
          <circle cx="120" cy="360" r="1.2" />
        </g>

        <!-- soft nebula-smoke silhouette, roughly tracing the pose -->
        <g class="figure-glow" filter="url(#figureBlur)">
          <ellipse cx="236" cy="108" rx="19" ry="23" fill="url(#bodyGrad)" />
          <ellipse cx="216" cy="168" rx="36" ry="52" fill="url(#bodyGrad)" />
          <ellipse cx="199" cy="212" rx="30" ry="26" fill="url(#bodyGrad)" />
          <ellipse cx="176" cy="248" rx="24" ry="38" fill="url(#bodyGrad)" />
          <ellipse cx="218" cy="278" rx="19" ry="50" fill="url(#bodyGrad)" />
          <ellipse cx="248" cy="150" rx="14" ry="34" fill="url(#bodyGrad)" />
        </g>

        <g class="figure-lines">
          <line x1="245" y1="100" x2="228" y2="125" />
          <line x1="228" y1="125" x2="205" y2="130" />
          <line x1="228" y1="125" x2="232" y2="145" />
          <line x1="205" y1="130" x2="240" y2="90" />
          <line x1="240" y1="90" x2="255" y2="60" />
          <line x1="232" y1="145" x2="248" y2="190" />
          <line x1="248" y1="190" x2="250" y2="225" />
          <line x1="205" y1="130" x2="215" y2="165" />
          <line x1="232" y1="145" x2="215" y2="165" />
          <line x1="215" y1="165" x2="205" y2="190" />
          <line x1="205" y1="190" x2="198" y2="210" />
          <line x1="198" y1="210" x2="188" y2="213" />
          <line x1="198" y1="210" x2="210" y2="208" />
          <line x1="188" y1="213" x2="165" y2="240" />
          <line x1="165" y1="240" x2="185" y2="285" />
          <line x1="185" y1="285" x2="200" y2="295" />
          <line x1="210" y1="208" x2="222" y2="265" />
          <line x1="222" y1="265" x2="215" y2="320" />
          <line x1="215" y1="320" x2="225" y2="330" />
          <line class="spear" x1="255" y1="60" x2="300" y2="15" />
          <line class="spear" x1="255" y1="60" x2="225" y2="95" />
        </g>

        <polygon class="spearhead" points="300,1 310,15 300,36 290,15" />

        <g class="figure-joints">
          <circle class="star-major" cx="245" cy="100" r="4" />
          <circle cx="228" cy="125" r="2" />
          <circle cx="205" cy="130" r="2.4" />
          <circle cx="232" cy="145" r="2.4" />
          <circle cx="240" cy="90" r="2" />
          <circle class="star-major" cx="255" cy="60" r="2.6" />
          <circle cx="248" cy="190" r="2" />
          <circle cx="250" cy="225" r="2.2" />
          <circle cx="215" cy="165" r="2.2" />
          <circle cx="205" cy="190" r="2" />
          <circle cx="198" cy="210" r="2.4" />
          <circle cx="188" cy="213" r="1.8" />
          <circle cx="210" cy="208" r="1.8" />
          <circle cx="165" cy="240" r="2.2" />
          <circle cx="185" cy="285" r="2" />
          <circle class="star-major" cx="200" cy="295" r="2.4" />
          <circle cx="222" cy="265" r="2" />
          <circle cx="215" cy="320" r="2" />
          <circle class="star-major" cx="225" cy="330" r="2.4" />
        </g>
      </svg>
    </div>
    <p class="hero-hint" id="hero-hint">WAITING FOR COMMAND</p>
  </section>

  <section class="chat" id="chat" hidden>
    <div class="chat-log" id="chat-log"></div>
  </section>
</main>

<div class="notifications" id="notifications" aria-live="polite"></div>

<footer class="hud-input">
  <span class="prompt-caret">&gt;</span>
  <input id="input" type="text" autocomplete="off" placeholder="Entrez une commande…" />
  <button id="send" type="button">ENVOYER</button>
</footer>

<script src="/app.js"></script>
</body>
</html>
